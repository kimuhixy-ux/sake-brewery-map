<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Japan Sake Brewery Map</title>
<meta name="description" content="A PWA for finding sake breweries across Japan using OpenStreetMap data, with notes on famous brands.">
<link rel="canonical" href="https://kimuhixy.com/sake-brewery-map/en/">
<link rel="alternate" hreflang="ja" href="https://kimuhixy.com/sake-brewery-map/">
<link rel="alternate" hreflang="en" href="https://kimuhixy.com/sake-brewery-map/en/">
<link rel="alternate" hreflang="x-default" href="https://kimuhixy.com/sake-brewery-map/">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22334a">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sake Map">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="../vendor/markercluster/MarkerCluster.Default.css">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header id="app-header">
  <h1>Japan Sake Brewery Map</h1>
</header>

<div id="map"></div>

<button id="locate-btn" title="Go to current location" aria-label="Go to current location">📍</button>
<button id="info-btn" title="About this app" aria-label="About this app">ℹ️</button>

<div id="info-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <button id="info-modal-close" class="modal-close" aria-label="Close">✕</button>
    <h2>Japan Sake Brewery Map</h2>
    <p class="modal-desc">A PWA for finding sake breweries, wineries, and craft beer breweries across Japan using OpenStreetMap data.</p>
    <ul class="modal-links">
      <li><a href="about.html">About</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="../">日本語</a></li>
    </ul>
  </div>
</div>

<div id="control-panel">
  <div class="control-row">
    <input type="text" id="search-input" placeholder="Search by brewery or brand name…" autocomplete="off">
  </div>
  <div class="control-row">
    <select id="pref-select">
      <option value="">Prefecture: All</option>
    </select>
    <select id="category-select">
      <option value="">Type: All</option>
      <option value="sake">Sake</option>
      <option value="shochu">Shochu</option>
      <option value="awamori">Awamori</option>
      <option value="beer">Craft Beer</option>
      <option value="wine">Wine</option>
    </select>
    <button id="featured-toggle" class="toggle-btn" aria-pressed="false">🏵 Featured breweries only</button>
    <button id="award-toggle" class="toggle-btn" aria-pressed="false">🏆 Award-winning breweries only</button>
  </div>
  <div class="control-row" id="count-row">
    <span id="result-count"></span>
  </div>
</div>

<!-- Leaflet JS -->
<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../vendor/markercluster/leaflet.markercluster.js"></script>

<script src="../js/i18n.js"></script>
<script src="../js/strings.js"></script>
<script src="../js/pref-labels.js"></script>
<script src="../js/config.js"></script>
<script src="../js/affiliate.js"></script>
<script src="../js/app.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/donate.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').then((reg) => {
      reg.update();
    }).catch(console.error);
  });

  let refreshingAfterUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshingAfterUpdate) return;
    refreshingAfterUpdate = true;
    window.location.reload();
  });
}
</script>

</body>
</html>
